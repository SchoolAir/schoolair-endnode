# Drop-in for the stock pigpiod.service (installed to
# /etc/systemd/system/pigpiod.service.d/schoolair-early.conf).
#
# 1. Early start. The stock unit is WantedBy=multi-user.target with default
#    dependencies, so it starts only after the whole of sysinit/basic.target —
#    over 75s into a Pi Zero W boot. schoolair-led.service needs it, and wants
#    to start at the very beginning of boot, so pigpiod must not wait for that
#    either. It needs nothing from the network or from the rest of the boot (it
#    only talks to the GPIO/DMA hardware and listens on localhost).
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target

# 2. `-m` disables pigpio's alert/callback sampling. We only ever *drive*
#    pins (status LED PWM, servo pulses — both DMA-based and unaffected); no
#    code reads input pins or registers callbacks. Without -m pigpiod polls
#    the GPIO level ~200,000 times a second: 10% of the Pi Zero W's single
#    core, all the time, including through boot, where the CPU is the
#    bottleneck (measured 10% -> 1%, LED PWM unchanged).
[Service]
ExecStart=
ExecStart=/usr/bin/pigpiod -l -m

# 3. Same top CPU share as the LED daemon it serves (see schoolair-led.service).
CPUWeight=1000
Nice=-5
