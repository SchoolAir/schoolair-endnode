# Drop-in (installed as /etc/systemd/system/<unit>.service.d/schoolair-priority.conf
# for the units listed in schoolair_setup.sh).
#
# A Pi Zero W boot is CPU-bound end to end: measured 1.5s of idle CPU in the
# first 141s. The total work is fixed, so ORDER matters: the LED "ok" waits on
# networking (NetworkManager, wpa_supplicant, dbus) and then the app. Give those
# a bigger share of the CPU while everything else (avahi, ssh, timesyncd, udev
# housekeeping, ...) queues behind them — the same work, done in the order that
# gets the device online, and the LED to "ok", sooner.
[Service]
CPUWeight=500
