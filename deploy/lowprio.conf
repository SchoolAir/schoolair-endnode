# Drop-in (installed as /etc/systemd/system/<unit>.service.d/schoolair-lowprio.conf
# for the housekeeping units listed in schoolair_setup.sh).
#
# On a Pi Zero W (one slow core) these jobs run right after boot — timers are
# "Persistent" and the clock jumps from 1970 to now at the first NTP sync, so
# every one of them looks overdue — and compete with the app coming up (apt-daily
# alone was ~14s of CPU). They still run; they just yield to everything else.
[Service]
Nice=19
IOSchedulingClass=idle
CPUWeight=5
