# Drop-in for schoolair-flower.service (the unit itself comes from
# SchoolAir/Flower-End-node). schoolair_setup.sh installs the flower on every
# indoor unit and enables it; these conditions make it run only where it can:
#   - a flower is fitted (detect_flower.sh found the dock's strap), and
#   - pigpiod is installed. On a new unit that happens once the network is up
#     (schoolair-pigpio-setup.service, which then starts the flower). Without
#     this the service would fail and restart every 10 s until then.
# An unmet condition skips the start quietly; it is not a failure.
[Unit]
ConditionPathExists=/etc/schoolair-flower-fitted
ConditionPathExists=/var/lib/schoolair-pigpio-installed
